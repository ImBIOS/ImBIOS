name: Get Top Followers

on:
  schedule:
    - cron: "0 20 1 * *" # Run at 20:00 on the first day of every month
  workflow_dispatch:

jobs:
  top-followers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Install requests
        run: pip install requests
      - name: Update README
        run: python src/get_top_followers.py ${{ github.repository_owner }} ${{ secrets.GITHUB_TOKEN }} README.md
      - name: Commit changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Submodule pointers must never be committed by automation: CI
          # checkouts (shallow, no submodules) record local gitlink SHAs
          # that don't exist upstream, permanently breaking every later
          # `submodules: recursive` checkout (see Update README failure
          # 2026-11-02: phantom 9ae7794 in submodules/private).
          git reset -q -- submodules/ 2>/dev/null || true
          git add -A -- ':!submodules'
          git diff-index --quiet HEAD || git commit -m "Update top followers"
      - name: Pull changes
        run: git pull -r
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
