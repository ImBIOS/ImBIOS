name: Update README

on:
  schedule:
    - cron: "0 0 * * 0" # Run at 00:00 every Sunday
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      # Private submodules need a token that can actually read them.
      # GITHUB_TOKEN only covers THIS repo, so `submodules: recursive`
      # fails with "Repository not found" on every private submodule.
      # The repo-level GH_TOKEN secret (classic PAT with `repo` scope)
      # fixes it. Fallback when the PAT is missing/expired: build the
      # README from the submodules that ARE available instead of failing
      # the whole run — blog/product sections degrade, they don't die.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          submodules: recursive
      - name: Report submodule availability
        run: |
          for s in submodules/blog submodules/notes submodules/private; do
            if [ -e "$s" ] && [ -n "$(ls -A "$s" 2>/dev/null)" ]; then
              echo "$s: present"
            else
              echo "::warning::submodule $s missing (check GH_TOKEN scope/expiry); sections sourced from it will be skipped"
            fi
          done
      - uses: oven-sh/setup-bun@v1
      - name: Update blog posts and products
        run: |
          bun install --frozen-lockfile
          bun src/list-posts.ts
          bun src/list-products.ts
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "Update README sections"
      - name: Pull changes
        run: git pull -r
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
